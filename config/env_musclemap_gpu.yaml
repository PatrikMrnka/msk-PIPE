name: msk_musclemap_gpu
# PyTorch (CUDA) is NOT installed by conda here. The runner installs it via pip
# from download.pytorch.org (cu128 by default, cu126 for pre-Turing GPUs or old
# drivers) right after the environment is created – see runner/micromamba.py.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.8
  - pip
